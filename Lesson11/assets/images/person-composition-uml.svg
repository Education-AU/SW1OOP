<svg xmlns="http://www.w3.org/2000/svg" width="760" height="492" viewBox="0 0 760 492">
  <title>Employee and Customer use composition with Person</title>
  <desc>Filled diamonds at Employee and Customer connect to a shared arrow pointing to Person.</desc>
  <g stroke="#243b53" stroke-width="2">
    <path d="M398 115H452V363H398 M452 226H505" fill="none" />
    <path d="M388 115l10-6 10 6-10 6z M388 363l10-6 10 6-10 6z M505 226l-11-6v12z" fill="#243b53" />
  </g>
  <g fill="#10233f" font-family="Consolas, monospace" font-size="18">
    <g transform="translate(8 8)">
      <rect width="380" height="216" fill="#fff" />
      <rect width="380" height="38" fill="#e8eef5" />
      <path d="M0 0H380V216H0Z M0 38H380 M0 92H380" fill="none" stroke="#243b53" stroke-width="2" />
      <text x="190" y="27" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">Employee</text>
      <text x="15" y="60">- person: Person</text>
      <text x="15" y="82">- salary: double</text>
      <text x="15" y="114">+ get_name(): string</text>
      <text x="15" y="136">+ get_cpr(): long</text>
      <text x="15" y="158">+ get_age(): int</text>
      <text x="15" y="180">+ has_birthDay(): bool</text>
      <text x="15" y="202">+ annual_income(): double</text>
    </g>
    <g transform="translate(8 246)">
      <rect width="380" height="238" fill="#fff" />
      <rect width="380" height="38" fill="#e8eef5" />
      <path d="M0 0H380V238H0Z M0 38H380 M0 114H380" fill="none" stroke="#243b53" stroke-width="2" />
      <text x="190" y="27" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">Customer</text>
      <text x="15" y="60">- person: Person</text>
      <text x="15" y="82">- credit_max: double</text>
      <text x="15" y="104">- credit: double</text>
      <text x="15" y="136">+ get_name(): string</text>
      <text x="15" y="158">+ get_cpr(): long</text>
      <text x="15" y="180">+ get_age(): int</text>
      <text x="15" y="202">+ has_birthDay(): bool</text>
      <text x="15" y="224">+ can_buy_on_credit(amount): bool</text>
    </g>
    <g transform="translate(505 129)">
      <rect width="247" height="194" fill="#fff" />
      <rect width="247" height="38" fill="#e8eef5" />
      <path d="M0 0H247V194H0Z M0 38H247 M0 92H247" fill="none" stroke="#243b53" stroke-width="2" />
      <text x="123.5" y="27" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">Person</text>
      <text x="15" y="60">- cpr: long</text>
      <text x="15" y="82">- name: string</text>
      <text x="15" y="114">+ get_name(): string</text>
      <text x="15" y="136">+ get_cpr(): long</text>
      <text x="15" y="158">+ get_age(): int</text>
      <text x="15" y="180">+ has_birthDay(): bool</text>
    </g>
  </g>
</svg>
